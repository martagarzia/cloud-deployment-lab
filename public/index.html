<body>
  <!-- Create the main content of the page. -->
  <main class="home-page">

    <div class="recipe-filter">
      <button type="button" class="cook-filter cook-tag-mamma" data-cook="mamma" aria-pressed="false">#mamma</button>
      <button type="button" class="cook-filter cook-tag-papa" data-cook="papa" aria-pressed="false">#papa</button>

    <!-- Create the list of recipe links. -->
    <ul class="recipe-list">
      <!-- Link to the carbonara recipe page. -->
      <li class="recipe-item" data-cook="mamma"><a href="ricette/carbonara.html">Carbonara</a><span class="recipe-item-tag cook-tag-mamma">#mamma</span></li>

      <!-- Link to the tortellini recipe page. -->
      <li class="recipe-item" data-cook="mamma"><a href="ricette/tortellini.html">Tortellini in brodo</a><span class="recipe-item-tag cook-tag-mamma">#mamma</span></li>

      <!-- Link to the orange jam recipe page. -->

      <!-- Link to the grape jam recipe page. -->
      <li class="recipe-item" data-cook="mamma"><a href="ricette/marmellata-uva-nera.html">Marmellata di uva nera</a><span class="recipe-item-tag cook-tag-mamma">#mamma</span></li>

      <!-- Link to the pizzaiola recipe page. -->

      <li class="recipe-item" data-cook="mamma"><a href="ricette/mostarda-zucca.html">Mostarda di zucca</a><span class="recipe-item-tag cook-tag-mamma">#mamma</span></li>

      <li class="recipe-item" data-cook="mamma"><a href="ricette/zuppa-funghi-castagne.html">Zuppa di funghi e castagne</a><span class="recipe-item-tag cook-tag-mamma">#mamma</span></li>

  </main>

  <!-- Load the reusable site navigation. -->
  <script src="/js/site-navigation.js"></script>
