<!DOCTYPE html>
<html lang="it">
<head>
  <!-- Define the character encoding. -->
  <meta charset="UTF-8">

  <!-- Make the page responsive on different screen sizes. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Define the page title shown in the browser tab. -->
  <title>Cuochi</title>

  <!-- Load the CSS stylesheet. -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Create the main content of the page. -->
  <main>
    <!-- Show the page title. -->
    <h1>Cuochi</h1>

    <!-- List the cooks of the site. -->
    <ul class="cook-list">
      <!-- Card for Mamma, with her profile photo. -->
      <li class="cook-card">
        <img class="cook-avatar" src="images/mamma.jpg" alt="Mamma">
        <h2>Mamma</h2>
      </li>

      <!-- Card for Papa, with his profile photo. -->
      <li class="cook-card">
        <img class="cook-avatar" src="images/papa.jpg" alt="Papà">
        <h2>Papà</h2>
      </li>
    </ul>

    <!-- Link back to the recipe list. -->
    <a href="index.html">← Torna alle ricette</a>
  </main>

  <!-- Load the reusable site navigation. -->
  <script src="/js/site-navigation.js"></script>
</body>
</html>
